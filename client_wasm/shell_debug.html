<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FNAF Web Client (Debug)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #canvas {
      position: absolute;
      display: block;
      outline: none;
      background: #000;
    }

    #top-right-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 50;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .ctrl-btn {
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      padding: 8px 10px;
      background: rgba(18, 18, 18, 0.50);
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .ctrl-btn:hover {
      background: rgba(34, 34, 34, 0.68);
    }

    #debug-pill {
      border-radius: 999px;
      border: 1px solid rgba(102, 187, 255, 0.6);
      background: rgba(20, 42, 74, 0.65);
      color: #b8deff;
      padding: 5px 10px;
      font-size: 11px;
      letter-spacing: .02em;
    }

    #debug-terminal {
      position: absolute;
      left: 12px;
      bottom: 12px;
      width: min(48vw, 720px);
      max-height: 28vh;
      overflow: auto;
      z-index: 49;
      border: 1px solid rgba(126, 196, 255, 0.35);
      border-radius: 8px;
      background: rgba(6, 12, 20, 0.78);
      color: #bfe2ff;
      font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 8px 10px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 8px 20px rgba(0,0,0,.4);
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="top-right-controls">
      <div id="debug-pill">Debug Shell</div>
      <button id="fs-audio-btn" class="ctrl-btn" type="button">Fullscreen + Audio</button>
    </div>
    <pre id="debug-terminal">[debug shell] ready\n</pre>
  </div>

  <script>
    var Module = Module || {};
    window.__fnafAudioEnabled = false;

    function pushAudioToggleStateToWasm() {
      if (Module && typeof Module._wasm_on_audio_toggle === "function") {
        Module._wasm_on_audio_toggle(window.__fnafAudioEnabled ? 1 : 0);
      }
    }

    function appendTerminal(line) {
      const el = document.getElementById("debug-terminal");
      if (!el) return;
      el.textContent += String(line) + "\n";
      const limit = 12000;
      if (el.textContent.length > limit) {
        el.textContent = el.textContent.slice(el.textContent.length - limit);
      }
      el.scrollTop = el.scrollHeight;
    }

    var prevPrint = Module.print;
    Module.print = function(text) {
      if (typeof prevPrint === "function") prevPrint(text);
      else console.log(text);
      appendTerminal(text);
    };
    var prevErr = Module.printErr;
    Module.printErr = function(text) {
      if (typeof prevErr === "function") prevErr(text);
      else console.error(text);
      appendTerminal("[err] " + text);
    };

    var priorRuntimeInit = Module.onRuntimeInitialized;
    Module.onRuntimeInitialized = function() {
      if (typeof priorRuntimeInit === "function") priorRuntimeInit();
      pushAudioToggleStateToWasm();
    };

    Module.canvas = (function() {
      return document.getElementById("canvas");
    })();

    function fitCanvasToViewport() {
      var app = document.getElementById("app");
      var canvas = Module.canvas || document.getElementById("canvas");
      if (!app || !canvas) return;
      var viewportW = app.clientWidth || window.innerWidth || 1280;
      var viewportH = app.clientHeight || window.innerHeight || 720;
      canvas.style.width = viewportW + "px";
      canvas.style.height = viewportH + "px";
      canvas.style.left = "0px";
      canvas.style.top = "0px";
    }

    window.addEventListener("resize", fitCanvasToViewport);
    window.addEventListener("orientationchange", fitCanvasToViewport);
    document.addEventListener("fullscreenchange", fitCanvasToViewport);
    fitCanvasToViewport();

    document.getElementById("fs-audio-btn").addEventListener("click", function() {
      appendTerminal("[ui] Fullscreen + Audio clicked");
      var canvas = Module.canvas || document.getElementById("canvas");
      if (canvas && canvas.requestFullscreen) canvas.requestFullscreen();
      window.__fnafAudioEnabled = true;
      pushAudioToggleStateToWasm();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
