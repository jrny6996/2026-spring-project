<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FNAF Web Client</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #canvas {
      position: absolute;
      display: block;
      outline: none;
      background: #000;
    }

    #fullscreen-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 6px;
      padding: 9px 12px;
      background: rgba(18, 18, 18, 0.45);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    #fullscreen-btn:hover {
      background: rgba(34, 34, 34, 0.62);
    }

    #fullscreen-prompt {
      position: absolute;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 21;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.30);
      background: rgba(0, 0, 0, 0.45);
      color: #f5f5f5;
      font-size: 14px;
      line-height: 1.25;
      user-select: none;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <button id="fullscreen-btn" type="button">Fullscreen + Audio</button>
    <div id="fullscreen-prompt">Click to enter fullscreen for best experience</div>
  </div>

  <script>
    var Module = Module || {};
    window.__fnafAudioEnabled = false;
    function pushAudioToggleStateToWasm() {
      if (Module && typeof Module._wasm_on_audio_toggle === "function") {
        Module._wasm_on_audio_toggle(window.__fnafAudioEnabled ? 1 : 0);
      }
    }
    var priorRuntimeInit = Module.onRuntimeInitialized;
    Module.onRuntimeInitialized = function() {
      if (typeof priorRuntimeInit === "function") {
        priorRuntimeInit();
      }
      pushAudioToggleStateToWasm();
    };
    Module.canvas = (function() {
      return document.getElementById("canvas");
    })();

    function fitCanvasToViewport() {
      var app = document.getElementById("app");
      var canvas = Module.canvas || document.getElementById("canvas");
      if (!app || !canvas) return;

      var viewportW = app.clientWidth || window.innerWidth || 1280;
      var viewportH = app.clientHeight || window.innerHeight || 720;
      // Fill viewport so pre-fullscreen render never appears letterboxed.
      canvas.style.width = viewportW + "px";
      canvas.style.height = viewportH + "px";
      canvas.style.left = "0px";
      canvas.style.top = "0px";
    }

    window.addEventListener("resize", fitCanvasToViewport);
    window.addEventListener("orientationchange", fitCanvasToViewport);
    document.addEventListener("fullscreenchange", fitCanvasToViewport);
    fitCanvasToViewport();

    function updateFullscreenPromptVisibility() {
      var prompt = document.getElementById("fullscreen-prompt");
      if (!prompt) return;
      var isFs = !!document.fullscreenElement;
      prompt.style.display = isFs ? "none" : "block";
    }
    document.addEventListener("fullscreenchange", updateFullscreenPromptVisibility);
    window.addEventListener("load", updateFullscreenPromptVisibility);
    updateFullscreenPromptVisibility();

    document.getElementById("fullscreen-btn").addEventListener("click", function() {
      window.__fnafAudioEnabled = true;
      pushAudioToggleStateToWasm();
      var canvas = Module.canvas || document.getElementById("canvas");
      if (canvas && canvas.requestFullscreen) canvas.requestFullscreen();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
